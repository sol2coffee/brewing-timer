<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6f4e37">
  <meta name="application-name" content="BREWING TIMER">
  <meta name="apple-mobile-web-app-title" content="BREWING TIMER">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>BREWING TIMER</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f4f6f1;
      --surface: #ffffff;
      --surface-strong: #ffffff;
      --text: #1f2420;
      --muted: #657066;
      --line: rgba(34, 45, 38, 0.15);
      --accent: #6f4e37;
      --accent-strong: #3f342c;
      --accent-soft: #dfe7df;
      --danger: #b34034;
      --danger-soft: #ffe4df;
      --success: #2f6b54;
      --shadow: 0 18px 48px rgba(35, 48, 39, 0.1);
      --radius: 8px;
      --focus: 0 0 0 3px rgba(97, 131, 160, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--page-bg);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0)),
        var(--page-bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
      -webkit-tap-highlight-color: rgba(111, 78, 55, 0.12);
    }

    button,
    input,
    select {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    input,
    select {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-strong);
      color: var(--text);
      font-size: 16px;
      outline: none;
    }

    input {
      padding: 11px 12px;
    }

    select {
      padding: 11px 36px 11px 12px;
    }

    input:focus,
    select:focus,
    button:focus-visible {
      box-shadow: var(--focus);
      outline: none;
    }

    input[aria-invalid="true"] {
      border-color: var(--danger);
      background: var(--danger-soft);
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .hidden {
      display: none !important;
    }

    .setup-screen {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: calc(18px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom));
    }

    .setup-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 2px 16px;
    }

    .kicker {
      margin: 0;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 4px 0 5px;
      font-size: clamp(29px, 9vw, 46px);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    .status-note {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin: 0 0 16px;
      padding: 11px 12px;
      border: 1px solid rgba(47, 107, 84, 0.18);
      border-radius: 8px;
      background: rgba(47, 107, 84, 0.08);
      color: #264d40;
      font-size: 13px;
      line-height: 1.45;
    }

    .language-card {
      display: grid;
      grid-template-columns: auto minmax(128px, 1fr);
      gap: 10px;
      align-items: center;
      margin: 0 0 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.62);
    }

    .language-card label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .status-dot {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      margin-top: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .recipe-panel {
      display: grid;
      gap: 0;
    }

    .section-title {
      margin: 0 0 11px;
      color: var(--accent-strong);
      font-size: 15px;
      font-weight: 800;
    }

    .preset-card,
    .end-time-card,
    .start-prep-card {
      display: grid;
      gap: 12px;
      margin-bottom: 15px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-strong);
    }

    .preset-grid {
      display: grid;
      grid-template-columns: 0.72fr 1fr;
      gap: 10px;
    }

    .preset-summary,
    .recipe-note,
    .timer-prep-note {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .recipe-note {
      margin-bottom: 15px;
      padding: 11px 12px;
      border: 1px solid rgba(47, 107, 84, 0.18);
      border-radius: 8px;
      background: rgba(47, 107, 84, 0.08);
      color: #264d40;
      font-weight: 750;
    }

    .preset-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .custom-preset-area {
      display: grid;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .recipe-import-area {
      display: grid;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .import-status {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .import-status.success {
      color: var(--success);
      font-weight: 750;
    }

    .import-status.error {
      color: var(--danger);
      font-weight: 750;
    }

    .custom-preset-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .time-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: end;
    }

    .start-prep-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 110px;
      gap: 10px;
      align-items: end;
    }

    .colon {
      align-self: center;
      padding-top: 26px;
      color: var(--muted);
      font-weight: 800;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .field-unit {
      position: relative;
    }

    .field-unit input {
      padding-right: 42px;
    }

    .field-unit span {
      position: absolute;
      right: 12px;
      bottom: 13px;
      color: var(--muted);
      font-size: 13px;
      pointer-events: none;
    }

    .stage-list {
      display: grid;
      gap: 12px;
    }

    .stage-card {
      display: grid;
      gap: 13px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-strong);
    }

    .stage-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .stage-title {
      margin: 0;
      font-size: 20px;
      line-height: 1;
    }

    .stage-grid {
      display: grid;
      gap: 11px;
    }

    .stage-time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stage-number-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .computed {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      padding: 10px 11px;
      border-radius: 8px;
      background: #edf0ea;
      color: #303a31;
      font-size: 14px;
      font-weight: 750;
    }

    .stage-error,
    .global-error {
      display: none;
      color: var(--danger);
      font-size: 13px;
      line-height: 1.4;
    }

    .stage-error.visible,
    .global-error.visible {
      display: block;
    }

    .global-error {
      margin: 0 0 12px;
      padding: 12px;
      border: 1px solid rgba(179, 64, 52, 0.2);
      border-radius: 8px;
      background: var(--danger-soft);
      font-weight: 700;
    }

    .settings-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 50px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-strong);
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
    }

    .toggle input[type="checkbox"] {
      width: 22px;
      min-height: 22px;
      accent-color: var(--accent);
    }

    .sound-toggle {
      display: grid;
      grid-template-columns: auto minmax(96px, 1fr) auto auto;
      align-items: center;
    }

    .sound-toggle .toggle-text {
      white-space: nowrap;
    }

    .volume-slider {
      width: 100%;
      min-width: 0;
      min-height: 22px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .volume-value {
      min-width: 36px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
      text-align: right;
    }

    .debug-panel {
      display: grid;
      gap: 8px;
      margin-top: 14px;
      padding: 12px;
      border: 1px dashed rgba(111, 78, 55, 0.36);
      border-radius: 8px;
      background: rgba(234, 217, 202, 0.42);
    }

    .debug-panel label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .creator-footer {
      display: grid;
      gap: 10px;
      justify-items: center;
      padding: 18px 4px 4px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      line-height: 1.45;
    }

    .creator-footer p {
      margin: 0;
    }

    .social-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .social-link {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.68);
      color: var(--accent-strong);
      text-decoration: none;
    }

    .social-link svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .social-link.youtube svg {
      width: 23px;
      height: 23px;
      fill: currentColor;
      stroke: none;
    }

    .social-link:focus-visible {
      box-shadow: var(--focus);
      outline: none;
    }

    .bottom-bar {
      position: fixed;
      z-index: 20;
      right: 0;
      bottom: 0;
      left: 0;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(62, 42, 32, 0.12);
      background: rgba(244, 246, 241, 0.9);
      backdrop-filter: blur(18px);
    }

    .bottom-inner {
      display: grid;
      grid-template-columns: minmax(112px, 0.65fr) 1fr;
      gap: 10px;
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .btn {
      min-height: 46px;
      border-radius: 8px;
      padding: 12px 14px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: 15px;
      font-weight: 850;
    }

    .btn.primary {
      min-height: 56px;
      background: var(--accent);
      color: #fffdf8;
      font-size: 18px;
      box-shadow: 0 14px 26px rgba(111, 78, 55, 0.26);
    }

    .btn.secondary {
      background: #e4eae2;
      color: #28352c;
    }

    .btn.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .btn.icon {
      display: inline-grid;
      place-items: center;
      width: 46px;
      min-height: 46px;
      padding: 0;
      border-radius: 50%;
      font-size: 22px;
      line-height: 1;
    }

    .timer-screen {
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(18px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--timer-bg, #6f4e37);
      color: var(--timer-fg, #fffaf3);
      transition: background-color 420ms ease, color 240ms ease;
    }

    .timer-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(10px, 2.2vh, 18px);
      width: min(100%, 760px);
      min-height: calc(100vh - 30px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      min-height: calc(100dvh - 30px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      margin: 0 auto;
    }

    .timer-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      min-height: 44px;
    }

    .timer-brand {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.08em;
      opacity: 0.88;
    }

    .state-badge {
      min-height: 34px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      font-size: 13px;
      font-weight: 850;
    }

    .timer-main {
      display: grid;
      align-content: start;
      gap: clamp(14px, 3.2vh, 28px);
      padding-top: clamp(10px, 3.2vh, 34px);
      text-align: center;
    }

    .timer-message {
      margin: 0 auto;
      max-width: 11ch;
      font-size: clamp(44px, 15vw, 84px);
      font-weight: 900;
      line-height: 1.03;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .timer-message.long-message {
      max-width: 14ch;
      font-size: clamp(34px, 10.5vw, 66px);
      line-height: 1.1;
    }

    .timer-prep-note {
      width: min(100%, 520px);
      margin: 12px auto 0;
      color: inherit;
      font-size: clamp(15px, 3.8vw, 20px);
      font-weight: 800;
      opacity: 0.86;
    }

    .timer-countdown {
      min-height: 1.1em;
      font-size: clamp(54px, 19vw, 104px);
      font-weight: 900;
      line-height: 0.9;
    }

    .timer-countdown:empty {
      min-height: 0;
    }

    .time-display {
      display: grid;
      gap: 6px;
    }

    .elapsed-time {
      font-variant-numeric: tabular-nums;
      font-size: clamp(56px, 16vw, 112px);
      font-weight: 900;
      line-height: 1;
    }

    .end-time {
      font-variant-numeric: tabular-nums;
      font-size: clamp(17px, 3.8vw, 24px);
      font-weight: 800;
      opacity: 0.82;
    }

    .timer-info {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      text-align: left;
    }

    .info-item {
      min-height: 58px;
      padding: 10px 11px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.13);
    }

    .info-label {
      display: block;
      margin-bottom: 4px;
      font-size: 11px;
      font-weight: 850;
      opacity: 0.76;
    }

    .info-value {
      display: block;
      font-size: 16px;
      font-weight: 850;
      line-height: 1.2;
    }

    .progress-track {
      overflow: hidden;
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: currentColor;
      opacity: 0.82;
      transition: width 120ms linear;
    }

    .progress-time-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      font-weight: 800;
      opacity: 0.78;
    }

    .timer-controls {
      display: grid;
      gap: 10px;
    }

    .timer-screen .creator-footer {
      gap: 6px;
      padding: 0 4px;
      color: inherit;
      font-size: 11px;
      line-height: 1.2;
      opacity: 0.72;
    }

    .timer-screen .social-link {
      border-color: rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.12);
      color: inherit;
    }

    .timer-screen .social-link {
      width: 34px;
      height: 34px;
    }

    .timer-screen .social-link svg {
      width: 18px;
      height: 18px;
    }

    .timer-screen .social-link.youtube svg {
      width: 20px;
      height: 20px;
    }

    .timer-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .timer-screen .btn {
      background: rgba(255, 255, 255, 0.16);
      color: inherit;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .timer-screen .btn.primary {
      background: rgba(255, 255, 255, 0.92);
      color: #35251e;
      box-shadow: none;
    }

    .timer-screen .btn.danger {
      background: rgba(255, 255, 255, 0.12);
      color: inherit;
    }

    .finished-actions {
      display: none;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .timer-screen.is-finished .running-actions {
      display: none;
    }

    .timer-screen.is-finished .finished-actions {
      display: grid;
    }

    .modal-backdrop {
      position: fixed;
      z-index: 80;
      inset: 0;
      display: none;
      place-items: end center;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
      background: rgba(21, 15, 12, 0.42);
    }

    .modal-backdrop.open {
      display: grid;
    }

    .modal {
      width: min(100%, 420px);
      padding: 18px;
      border-radius: 8px;
      background: var(--surface-strong);
      color: var(--text);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.22);
    }

    .modal h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .modal p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 680px) {
      .setup-screen {
        padding-top: calc(28px + env(safe-area-inset-top));
      }

      .stage-grid {
        grid-template-columns: 1.05fr 1fr;
        align-items: start;
      }

      .timer-actions,
      .finished-actions {
        grid-template-columns: 1fr 1fr;
      }

      .modal-backdrop {
        place-items: center;
      }
    }

    @media (max-width: 370px) {
      .setup-screen {
        padding-inline: 12px;
      }

      .stage-card,
      .end-time-card,
      .start-prep-card {
        padding: 12px;
      }

      .start-prep-grid {
        grid-template-columns: 1fr;
      }

      .settings-row {
        grid-template-columns: 1fr;
      }

      .preset-grid {
        grid-template-columns: 1fr;
      }

      .custom-preset-actions {
        grid-template-columns: 1fr;
      }

      .preset-actions {
        grid-template-columns: 1fr;
      }

      .timer-info {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .timer-message {
        font-size: clamp(38px, 13vw, 48px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <main id="setupScreen" class="setup-screen" aria-labelledby="appTitle">
      <header class="setup-header">
        <div>
          <p class="kicker">MOBILE POUR OVER</p>
          <h1 id="appTitle">BREWING TIMER</h1>
          <p class="subtitle" data-i18n="subtitle">나만의 푸어링 레시피를 설정하세요</p>
        </div>
      </header>

      <p class="status-note">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="wakeLockHint">정확한 타이머 사용을 위해 추출 중에는 화면을 켜두세요.</span>
      </p>

      <section class="recipe-panel" aria-label="브루잉 레시피 설정" data-i18n-aria-label="setupAria">
        <p id="globalError" class="global-error" role="alert"></p>

      function normalizeLanguage(language) {
        return TRANSLATIONS[language] ? language : "ko";
      }

      function currentLanguage() {
        if (typeof appState !== "undefined" && appState.settings) {
          return normalizeLanguage(appState.settings.language);
        }
        return "ko";
      }

      function t(key, values) {
        var language = currentLanguage();
        var dictionary = TRANSLATIONS[language] || TRANSLATIONS.ko;
        var text = dictionary[key] || TRANSLATIONS.ko[key] || key;
        if (!values) {
          return text;
        }
        return text.replace(/\{(\w+)\}/g, function (match, name) {
          return Object.prototype.hasOwnProperty.call(values, name) ? String(values[name]) : match;
        });
      }

      function applyTranslations() {
        var language = currentLanguage();
        document.documentElement.lang = language;
        elements.languageSelect.value = language;

        var textElements = document.querySelectorAll("[data-i18n]");
        Array.prototype.forEach.call(textElements, function (element) {
          element.textContent = t(element.dataset.i18n);
        });

        var placeholderElements = document.querySelectorAll("[data-i18n-placeholder]");
        Array.prototype.forEach.call(placeholderElements, function (element) {
          element.setAttribute("placeholder", t(element.dataset.i18nPlaceholder));
        });

        var ariaElements = document.querySelectorAll("[data-i18n-aria-label]");
        Array.prototype.forEach.call(ariaElements, function (element) {
          element.setAttribute("aria-label", t(element.dataset.i18nAriaLabel));
        });

        elements.modalCancelButton.textContent = t("cancel");
        if (!elements.modalBackdrop.classList.contains("open")) {
          elements.modalTitle.textContent = t("confirmTitle");
          elements.modalMessage.textContent = t("confirmMessage");
          elements.modalConfirmButton.textContent = t("confirm");
        }
        updateWakeLockHint();
      }

      function renderPresetSelectors() {
        elements.presetCategory.innerHTML = "";
        RECIPE_PRESETS.forEach(function (group) {
          var option = document.createElement("option");
          option.value = group.id;
          option.textContent = group.label;
          elements.presetCategory.appendChild(option);
        });
        renderPresetRecipeOptions();
        elements.customPresetCategory.value = elements.presetCategory.value || RECIPE_PRESETS[0].id;
        updatePresetSummary();
      }

      function renderPresetRecipeOptions() {
        var group = getSelectedPresetGroup();
        elements.presetRecipe.innerHTML = "";
        if (!group) {
          return;
        }

        var recipes = getPresetRecipesForCategory(group.id);
        if (recipes.length === 0) {
          var emptyOption = document.createElement("option");
          emptyOption.value = "";
          emptyOption.textContent = t("savedRecipeNone");
          elements.presetRecipe.appendChild(emptyOption);
          elements.presetRecipe.disabled = true;
          elements.applyPresetButton.disabled = true;
          elements.deleteCustomPresetButton.disabled = true;
          return;
        }

        elements.presetRecipe.disabled = false;
        elements.applyPresetButton.disabled = false;
        recipes.forEach(function (recipe) {
          var option = document.createElement("option");
          option.value = recipe.id;
          option.textContent = recipe.name;
          elements.presetRecipe.appendChild(option);
        });
      }

      function getPresetRecipesForCategory(categoryId) {
        var group = getPresetGroupById(categoryId);
        var baseRecipes = group ? group.recipes.slice() : [];
        var customRecipes = appState.customPresets.filter(function (preset) {
          return preset.categoryId === categoryId;
        });
        return baseRecipes.concat(customRecipes);
      }

      function getPresetGroupById(categoryId) {
        for (var index = 0; index < RECIPE_PRESETS.length; index += 1) {
          if (RECIPE_PRESETS[index].id === categoryId) {
            return RECIPE_PRESETS[index];
          }
        }
        return null;
      }

      function getSelectedPresetGroup() {
        var selectedCategory = elements.presetCategory.value || RECIPE_PRESETS[0].id;
        return getPresetGroupById(selectedCategory) || RECIPE_PRESETS[0];
      }

      function getSelectedPreset() {
        var group = getSelectedPresetGroup();
        var recipes = group ? getPresetRecipesForCategory(group.id) : [];
        if (!group || recipes.length === 0) {
          return null;
        }
        var selectedRecipe = elements.presetRecipe.value || recipes[0].id;
        for (var index = 0; index < recipes.length; index += 1) {
          if (recipes[index].id === selectedRecipe) {
            return recipes[index];
          }
        }
        return recipes[0];
      }

      function updatePresetSummary() {
        var preset = getSelectedPreset();
        if (!preset) {
          elements.presetSummary.textContent = t("savedRecipeHint");
          elements.deleteCustomPresetButton.disabled = true;
          return;
        }
        elements.presetSummary.textContent = createRecipeSummary(preset, preset.isCustom);
        elements.deleteCustomPresetButton.disabled = !preset.isCustom;
      }

        var preset = getSelectedPreset();

        var soundEnabled = elements.soundEnabled.checked;

      function saveCurrentRecipeAsCustomPreset() {
        var name = elements.customPresetName.value.trim();
        if (!name) {
          showGlobalError(t("recipeNameRequired"));
          elements.customPresetName.focus();
          return;
        }

        var validation = validateSettings();
        if (!validation.valid) {
          handleValidationError(validation);
          return;
        }

        var categoryId = elements.customPresetCategory.value === "ice" ? "ice" : "hot";
        var existing = findCustomPresetByName(categoryId, name);
        if (existing) {
          openModal({
            title: t("overwriteTitle"),
            message: t("overwriteMessage"),
            confirmText: t("overwriteConfirm"),
            confirmClass: "danger",
            onConfirm: function () {
              upsertCustomPreset(categoryId, name, existing.id);
            }
          });
          return;
        }

        upsertCustomPreset(categoryId, name, null);
      }

      function upsertCustomPreset(categoryId, name, existingId) {
        readSettingsFromInputs();
        var typedPrepNote = elements.customPresetNote.value.trim();
        var customPreset = {
          id: existingId || createCustomPresetId(),
          categoryId: categoryId,
          name: name,
          summary: createRecipeSummary(appState.settings, true),
          prepNote: typedPrepNote || (categoryId === "ice" ? appState.settings.prepNote || "" : ""),
          prepMessage: appState.settings.prepMessage || "",
          preparationSeconds: appState.settings.preparationSeconds,
          extractionEndSeconds: appState.settings.extractionEndSeconds,
          stages: appState.settings.stages.map(function (stage) {
            return {
              startSeconds: stage.startSeconds,
              amountGrams: stage.amountGrams
            };
          }),
          isCustom: true,
          updatedAt: Date.now()
        };

        appState.customPresets = appState.customPresets.filter(function (preset) {
          return preset.id !== customPreset.id;
        });
        appState.customPresets.push(customPreset);
        appState.customPresets.sort(function (a, b) {
          return a.name.localeCompare(b.name, "ko");
        });
        appState.settings.prepNote = customPreset.prepNote;
        saveCustomPresets();
        saveSettings();
        elements.presetCategory.value = categoryId;
        renderPresetRecipeOptions();
        elements.presetRecipe.value = customPreset.id;
        elements.customPresetCategory.value = categoryId;
        updatePresetSummary();
        updateRecipeNote();
        elements.customPresetName.value = "";
      }

        appState.customPresets = appState.customPresets.filter(function (preset) {
          return preset.id !== presetId;
        });

        renderPresetRecipeOptions();

      function requestRecipeImportFile() {
        elements.recipeImportFile.value = "";
        elements.recipeImportFile.click();
      }

      function handleRecipeImportFileChange(event) {
        var file = event.target.files && event.target.files[0];
        if (!file) {
          return;
        }

        if (file.size > 65536) {
          showImportStatus(t("importRecipeTooLarge"), true);
          elements.recipeImportFile.value = "";
          return;
        }

        var reader = new FileReader();
        reader.onload = function () {
          importRecipeText(reader.result, file.name);
          elements.recipeImportFile.value = "";
        };
        reader.onerror = function () {
          showImportStatus(t("importRecipeReadError"), true);
          elements.recipeImportFile.value = "";
        };
        reader.readAsText(file, "UTF-8");
      }

      function importRecipeText(text, fileName) {
        try {
          var importedRecipes = parseRecipeTextList(text, fileName);
          var savedPresets = [];

          importedRecipes.forEach(function (importedRecipe) {
            var existing = findCustomPresetByName(importedRecipe.categoryId, importedRecipe.name);
            var customPreset = createCustomPresetFromImport(importedRecipe, existing ? existing.id : null);

            appState.customPresets = appState.customPresets.filter(function (preset) {
              return preset.id !== customPreset.id;
            });
            appState.customPresets.push(customPreset);
            savedPresets.push({
              preset: customPreset,
              overwritten: Boolean(existing)
            });
          });

          appState.customPresets.sort(function (a, b) {
            return a.name.localeCompare(b.name, "ko");
          });

          if (!savedPresets.length) {
            throw new Error(t("importRecipeEmpty"));
          }

          var selectedPreset = savedPresets[0].preset;
          applyImportedPresetToSettings(selectedPreset);

          saveCustomPresets();
          saveSettings();
          renderSetupScreen();
          elements.presetCategory.value = selectedPreset.categoryId;
          renderPresetRecipeOptions();
          elements.presetRecipe.value = selectedPreset.id;
          elements.customPresetCategory.value = selectedPreset.categoryId;
          updatePresetSummary();
          if (savedPresets.length === 1) {
            showImportStatus(t(savedPresets[0].overwritten ? "importRecipeOverwrite" : "importRecipeSuccess", { name: selectedPreset.name }), false);
          } else {
            showImportStatus(t("importRecipeBatchSuccess", { count: savedPresets.length }), false);
          }
        } catch (error) {
          showImportStatus(error && error.message ? error.message : t("importRecipeReadError"), true);
        }
      }

      function applyImportedPresetToSettings(customPreset) {
        appState.settings = {
          version: SETTINGS_VERSION,
          extractionEndSeconds: customPreset.extractionEndSeconds,
          stages: customPreset.stages.map(function (stage) {
            return {
              startSeconds: stage.startSeconds,
              amountGrams: stage.amountGrams
            };
          }),
          soundEnabled: elements.soundEnabled.checked,
          soundVolume: sanitizeSoundVolume(elements.soundVolume.value, DEFAULT_SETTINGS.soundVolume),
          language: appState.settings.language,
          presetName: customPreset.name,
          prepNote: customPreset.prepNote,
          prepMessage: customPreset.prepMessage || "",
          preparationSeconds: sanitizePreparationSeconds(customPreset.preparationSeconds, DEFAULT_SETTINGS.preparationSeconds)
        };
      }

      function createCustomPresetFromImport(importedRecipe, existingId) {
        var customPreset = {
          id: existingId || createCustomPresetId(),
          categoryId: importedRecipe.categoryId,
          name: importedRecipe.name,
          summary: "",
          prepNote: importedRecipe.prepNote,
          prepMessage: importedRecipe.prepMessage || "",
          preparationSeconds: sanitizePreparationSeconds(importedRecipe.preparationSeconds, DEFAULT_SETTINGS.preparationSeconds),
          extractionEndSeconds: importedRecipe.extractionEndSeconds,
          stages: importedRecipe.stages.map(function (stage) {
            return {
              startSeconds: stage.startSeconds,
              amountGrams: stage.amountGrams
            };
          }),
          isCustom: true,
          updatedAt: Date.now()
        };
        customPreset.summary = createRecipeSummary(customPreset, true);
        return customPreset;
      }

      function parseRecipeText(text, fileName) {
        return parseRecipeTextList(text, fileName)[0];
      }

      function parseRecipeTextList(text, fileName) {
        var source = normalizeRecipeImportText(String(text || "")).replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
        if (!source.trim()) {
          throw new Error(t("importRecipeEmpty"));
        }

        return splitRecipeImportBlocks(source).map(function (block, index) {
          return parseRecipeTextBlock(block, fileName, index);
        });
      }

      function splitRecipeImportBlocks(source) {
        var blocks = [];
        var currentBlock = [];

        source.split("\n").forEach(function (rawLine) {
          var line = rawLine.trim();
          if (line && !isRecipeImportCommentLine(line) && isRecipeImportNameLine(line) && hasRecipeImportContent(currentBlock)) {
            blocks.push(currentBlock.join("\n"));
            currentBlock = [];
          }
          currentBlock.push(rawLine);
        });

        if (hasRecipeImportContent(currentBlock)) {
          blocks.push(currentBlock.join("\n"));
        }

        return blocks.length ? blocks : [source];
      }

      function hasRecipeImportContent(lines) {
        return lines.some(function (rawLine) {
          var line = String(rawLine || "").trim();
          return Boolean(line && !isRecipeImportCommentLine(line));
        });
      }

      function isRecipeImportNameLine(line) {
        var field = splitRecipeImportFieldLine(line);
        return Boolean(field && normalizeRecipeImportKey(field.key) === "name");
      }

      function parseRecipeTextBlock(text, fileName, blockIndex) {
        var source = normalizeRecipeImportText(String(text || "")).replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
        if (!source.trim()) {
          throw new Error(t("importRecipeEmpty"));
        }

        var imported = {
          name: "",
          categoryId: "",
          prepNote: "",
