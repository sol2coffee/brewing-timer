        }).filter(function (stage) {
          return Number.isFinite(stage.startSeconds) && Number.isFinite(stage.amountGrams);
        }) : [];

        if (!name || stages.length < MIN_STAGES) {
          return null;
        }

        return {
          id: typeof value.id === "string" && value.id ? value.id : createCustomPresetId(),
          categoryId: categoryId,
          name: name,
          summary: typeof value.summary === "string" && value.summary ? value.summary : createRecipeSummary({
            extractionEndSeconds: sanitizeNonNegativeNumber(value.extractionEndSeconds, DEFAULT_SETTINGS.extractionEndSeconds),
            stages: stages
          }, "나만의"),
          prepNote: typeof value.prepNote === "string" ? value.prepNote.slice(0, 240) : "",
          prepMessage: typeof value.prepMessage === "string" ? value.prepMessage.slice(0, 80) : "",
          preparationSeconds: sanitizePreparationSeconds(value.preparationSeconds, DEFAULT_SETTINGS.preparationSeconds),
          extractionEndSeconds: sanitizeNonNegativeNumber(value.extractionEndSeconds, DEFAULT_SETTINGS.extractionEndSeconds),
          stages: stages,
          isCustom: true,
          updatedAt: sanitizeNonNegativeNumber(value.updatedAt, Date.now())
        };
      }

      function isValidSettingsShape(value) {
        return Boolean(
          value &&
          value.version === SETTINGS_VERSION &&
          isStoredNonNegativeNumber(value.extractionEndSeconds) &&
          Array.isArray(value.stages) &&
          value.stages.length >= MIN_STAGES &&
          value.stages.length <= MAX_STAGES &&
          value.stages.every(function (stage) {
            return Boolean(
              stage &&
              isStoredNonNegativeNumber(stage.startSeconds) &&
              isStoredNonNegativeNumber(stage.amountGrams)
            );
          })
        );
      }

      function migrateLegacySettings(value) {
        if (!value || !Array.isArray(value.stages)) {
          return createDefaultSettings();
        }

        return sanitizeSettings({
          version: SETTINGS_VERSION,
          extractionEndSeconds: value.extractionEndSeconds,
          stages: value.stages.slice(0, MAX_STAGES).map(function (stage, index) {
            var legacyAmount = Number(stage.durationSeconds) * Number(stage.flowRate);
            return {
              startSeconds: Number(stage.startSeconds),
              amountGrams: Number.isFinite(legacyAmount) && legacyAmount > 0 ? legacyAmount : DEFAULT_SETTINGS.stages[Math.min(index, DEFAULT_SETTINGS.stages.length - 1)].amountGrams
            };
          }),
          soundEnabled: value.soundEnabled,
          soundVolume: value.soundVolume,
          language: normalizeLanguage(value.language),
          presetName: t("userSettings"),
          prepNote: "",
          prepMessage: "",
          preparationSeconds: DEFAULT_SETTINGS.preparationSeconds
        });
      }

      function migratePreviousSettings(value) {
        return sanitizeSettings({
          version: SETTINGS_VERSION,
          extractionEndSeconds: value.extractionEndSeconds,
          stages: Array.isArray(value.stages) ? value.stages : [],
          soundEnabled: value.soundEnabled,
          soundVolume: value.soundVolume,
          language: value.language,
          presetName: value.presetName,
          prepNote: value.prepNote,
          prepMessage: "",
          preparationSeconds: DEFAULT_SETTINGS.preparationSeconds
        });
      }

      function sanitizeSettings(value) {
        var sanitized = {
          version: SETTINGS_VERSION,
          extractionEndSeconds: sanitizeNonNegativeNumber(value.extractionEndSeconds, DEFAULT_SETTINGS.extractionEndSeconds),
          stages: [],
          soundEnabled: Boolean(value.soundEnabled),
          soundVolume: sanitizeSoundVolume(value.soundVolume, DEFAULT_SETTINGS.soundVolume),
          language: normalizeLanguage(value.language),
          presetName: typeof value.presetName === "string" ? value.presetName : t("userSettings"),
          prepNote: typeof value.prepNote === "string" ? value.prepNote : "",
          prepMessage: typeof value.prepMessage === "string" ? value.prepMessage.slice(0, 80) : "",
          preparationSeconds: sanitizePreparationSeconds(value.preparationSeconds, DEFAULT_SETTINGS.preparationSeconds)
        };

        value.stages.slice(0, MAX_STAGES).forEach(function (stage, index) {
          sanitized.stages.push({
            startSeconds: sanitizeNonNegativeNumber(stage.startSeconds, index * 30),
            amountGrams: sanitizeNonNegativeNumber(stage.amountGrams, DEFAULT_SETTINGS.stages[Math.min(index, DEFAULT_SETTINGS.stages.length - 1)].amountGrams)
          });
        });

        if (sanitized.stages.length === 0) {
          sanitized.stages = createDefaultSettings().stages;
        }
        return sanitized;
      }

      function saveSettings() {
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.settings));
        } catch (error) {
          // localStorage가 차단되어도 앱 사용은 계속되어야 한다.
        }
      }

      function populateStaticTimeSelectors() {
        elements.endMinutes.innerHTML = createTimeSelectOptions(TIME_SELECTOR_MAX_MINUTES, 0);
        elements.endSeconds.innerHTML = createTimeSelectOptions(59, 0);
        elements.preparationSeconds.innerHTML = createTimeSelectOptions(MAX_PREPARATION_SECONDS, DEFAULT_SETTINGS.preparationSeconds);
      }

      function createTimeSelectOptions(maxValue, selectedValue) {
        var safeMax = Math.max(0, Math.floor(Number(maxValue) || 0));
        var safeSelected = Math.max(0, Math.floor(Number(selectedValue) || 0));
        var options = [];
        var optionCount = Math.max(safeMax, safeSelected);
        for (var value = 0; value <= optionCount; value += 1) {
          options.push('<option value="' + value + '"' + (value === safeSelected ? " selected" : "") + ">" + pad2(value) + "</option>");
        }
        return options.join("");
      }

      function setTimeSelectValue(select, value, maxValue) {
        var safeValue = Math.max(0, Math.floor(Number(value) || 0));
        if (!select.querySelector('option[value="' + safeValue + '"]')) {
          select.innerHTML = createTimeSelectOptions(Math.max(maxValue, safeValue), safeValue);
        }
        select.value = String(safeValue);
      }

      function renderSetupScreen() {
        var endParts = secondsToParts(appState.settings.extractionEndSeconds);
        setTimeSelectValue(elements.endMinutes, endParts.minutes, TIME_SELECTOR_MAX_MINUTES);
        setTimeSelectValue(elements.endSeconds, endParts.seconds, 59);
        elements.prepMessage.value = appState.settings.prepMessage || t("defaultPrepMessage");
        setTimeSelectValue(elements.preparationSeconds, appState.settings.preparationSeconds, MAX_PREPARATION_SECONDS);
        elements.soundEnabled.checked = appState.settings.soundEnabled;
        elements.soundVolume.value = String(sanitizeSoundVolume(appState.settings.soundVolume, DEFAULT_SETTINGS.soundVolume));
        updateSoundVolumeDisplay();
        elements.customPresetNote.value = appState.settings.prepNote || "";
        renderStageCards();
        updateRecipeNote();
        clearValidationState();
        updateAddStageButton();
        saveSettings();
      }

      function updateRecipeNote() {
        var note = appState.settings.prepNote || "";
        if (!note) {
          elements.recipeNote.textContent = "";
          elements.recipeNote.classList.add("hidden");
          return;
        }
        elements.recipeNote.textContent = note;
        elements.recipeNote.classList.remove("hidden");
      }

      function renderStageCards() {
        elements.stageList.innerHTML = "";
        var cumulativeAmounts = getCumulativeAmounts(appState.settings.stages);

        appState.settings.stages.forEach(function (stage, index) {
          var card = document.createElement("article");
          card.className = "stage-card";
          card.dataset.stageIndex = String(index);

          var startParts = secondsToParts(stage.startSeconds);
          var amount = calculateStageAmount(stage);
          var canDelete = appState.settings.stages.length > MIN_STAGES;

          card.innerHTML = [
            '<div class="stage-head">',
            '  <h3 class="stage-title">' + formatStageName(index + 1) + '</h3>',
            '  <button class="btn icon danger delete-stage-button" type="button" aria-label="' + t("stageDeleteAria", { stage: formatStageName(index + 1) }) + '"' + (canDelete ? "" : " disabled") + '>×</button>',
            '</div>',
            '<div class="stage-grid">',
            '  <div class="stage-time-grid">',
            '    <div class="field">',
            '      <label for="stage-' + index + '-minutes">' + t("startMinute") + '</label>',
            '      <select id="stage-' + index + '-minutes" class="stage-input" data-field="minutes" data-stage-index="' + index + '">' + createTimeSelectOptions(TIME_SELECTOR_MAX_MINUTES, startParts.minutes) + '</select>',
            '    </div>',
            '    <div class="field">',
            '      <label for="stage-' + index + '-seconds">' + t("startSecond") + '</label>',
            '      <select id="stage-' + index + '-seconds" class="stage-input" data-field="seconds" data-stage-index="' + index + '">' + createTimeSelectOptions(59, startParts.seconds) + '</select>',
            '    </div>',
            '  </div>',
            '  <div class="stage-number-grid">',
            '    <div class="field field-unit">',
            '      <label for="stage-' + index + '-amount">' + t("pouringAmount") + '</label>',
            '      <input id="stage-' + index + '-amount" class="stage-input" data-field="amount" data-stage-index="' + index + '" type="number" inputmode="decimal" min="0" step="1" autocomplete="off" value="' + formatNumberInput(stage.amountGrams) + '">',
            '      <span>g</span>',
            '    </div>',
            '  </div>',
            '</div>',
            '<div class="computed" aria-live="polite">',
            '  <span>' + t("currentPouringAmount", { amount: formatGrams(amount, 1) }) + '</span>',
            '  <span>' + t("cumulativeAmount", { amount: formatGrams(cumulativeAmounts[index], 1) }) + '</span>',
            '</div>',
            '<p class="stage-error" role="alert"></p>'
          ].join("");

          elements.stageList.appendChild(card);
        });
      }

      function handleSetupInputChange(event) {
        readSettingsFromInputs();
        saveSettings();

        if (event.target.classList.contains("stage-input")) {
          updateComputedAmountsOnly();
        } else if (event.target === elements.endMinutes || event.target === elements.endSeconds) {
          clearValidationState();
        }
      }

      function handleSoundVolumeInput() {
        var volume = sanitizeSoundVolume(elements.soundVolume.value, DEFAULT_SETTINGS.soundVolume);
        appState.settings.soundVolume = volume;
        updateSoundVolumeDisplay(volume);
        saveSettings();
      }

      function handleSoundVolumeCommit() {
        handleSoundVolumeInput();
        playSoundPreview();
      }

      function updateSoundVolumeDisplay(volume) {
        var safeVolume = sanitizeSoundVolume(typeof volume === "undefined" ? elements.soundVolume.value : volume, DEFAULT_SETTINGS.soundVolume);
        elements.soundVolumeValue.textContent = String(safeVolume) + "%";
      }

      function updateComputedAmountsOnly() {
        var cumulativeAmounts = getCumulativeAmounts(appState.settings.stages);
        var cards = elements.stageList.querySelectorAll(".stage-card");
        Array.prototype.forEach.call(cards, function (card, index) {
          var computed = card.querySelector(".computed");
          if (!computed) {
            return;
          }
          var amount = calculateStageAmount(appState.settings.stages[index]);
          computed.innerHTML = '<span>' + t("currentPouringAmount", { amount: formatGrams(amount, 1) }) + '</span><span>' + t("cumulativeAmount", { amount: formatGrams(cumulativeAmounts[index], 1) }) + '</span>';
        });
        clearValidationState();
      }

      function readSettingsFromInputs() {
        var endMinutes = parseWholeNumber(elements.endMinutes.value);
        var endSeconds = parseWholeNumber(elements.endSeconds.value);
        appState.settings.extractionEndSeconds = combineTimeParts(endMinutes, endSeconds);
        appState.settings.prepMessage = elements.prepMessage.value.trim().slice(0, 80);
        appState.settings.preparationSeconds = sanitizePreparationSeconds(elements.preparationSeconds.value, DEFAULT_SETTINGS.preparationSeconds);
        appState.settings.soundEnabled = elements.soundEnabled.checked;
        appState.settings.soundVolume = sanitizeSoundVolume(elements.soundVolume.value, DEFAULT_SETTINGS.soundVolume);

        var nextStages = appState.settings.stages.map(function (stage, index) {
          var minuteInput = findStageInput(index, "minutes");
          var secondInput = findStageInput(index, "seconds");
          var amountInput = findStageInput(index, "amount");
          return {
            startSeconds: combineTimeParts(parseWholeNumber(minuteInput.value), parseWholeNumber(secondInput.value)),
            amountGrams: parseDecimalNumber(amountInput.value)
          };
        });

        appState.settings.stages = nextStages;
      }

      function findStageInput(index, field) {
        return elements.stageList.querySelector('[data-stage-index="' + index + '"][data-field="' + field + '"]');
      }

      function addStage() {
        readSettingsFromInputs();
        if (appState.settings.stages.length >= MAX_STAGES) {
          updateAddStageButton();
          return;
        }

        var lastStage = appState.settings.stages[appState.settings.stages.length - 1];
        var newStart = Math.max(0, Math.floor(lastStage.startSeconds + 30));
        if (newStart >= appState.settings.extractionEndSeconds) {
          newStart = Math.max(0, Math.floor(appState.settings.extractionEndSeconds - 10));
        }

        appState.settings.stages.push({
          startSeconds: newStart,
          amountGrams: isFiniteNumber(lastStage.amountGrams) ? lastStage.amountGrams : 0
        });

        renderSetupScreen();
        focusStage(appState.settings.stages.length - 1);
      }

      function deleteStage(index) {
        readSettingsFromInputs();
        if (appState.settings.stages.length <= MIN_STAGES) {
          return;
        }
        appState.settings.stages.splice(index, 1);
        renderSetupScreen();
      }

      function updateAddStageButton() {
        elements.addStageButton.disabled = appState.settings.stages.length >= MAX_STAGES;
      }

      function focusStage(index) {
        window.requestAnimationFrame(function () {
          var input = findStageInput(index, "minutes");
          if (input) {
            input.focus();
            input.scrollIntoView({ block: "center", behavior: "smooth" });
          }
        });
      }

      elements.stageList.addEventListener("input", function (event) {
        if (event.target.classList.contains("stage-input")) {
          handleSetupInputChange(event);
        }
      });

      elements.stageList.addEventListener("change", function (event) {
        if (event.target.classList.contains("stage-input")) {
          handleSetupInputChange(event);
        }
      });

      elements.stageList.addEventListener("click", function (event) {
        var button = event.target.closest(".delete-stage-button");
        if (!button) {
          return;
        }
        var card = button.closest(".stage-card");
        deleteStage(Number(card.dataset.stageIndex));
      });

      function clearValidationState() {
        elements.globalError.textContent = "";
        elements.globalError.classList.remove("visible");
        [elements.endMinutes, elements.endSeconds].forEach(clearInputError);
        var inputs = elements.stageList.querySelectorAll("input, select");
        Array.prototype.forEach.call(inputs, clearInputError);
        var errors = elements.stageList.querySelectorAll(".stage-error");
        Array.prototype.forEach.call(errors, function (errorElement) {
          errorElement.textContent = "";
          errorElement.classList.remove("visible");
        });
      }

      function clearInputError(input) {
        input.removeAttribute("aria-invalid");
      }

      function setInputError(input) {
        if (input) {
          input.setAttribute("aria-invalid", "true");
        }
      }

      function setStageError(index, message) {
        var card = elements.stageList.querySelector('[data-stage-index="' + index + '"]');
        if (!card) {
          return;
        }
        var errorElement = card.querySelector(".stage-error");
        errorElement.textContent = message;
        errorElement.classList.add("visible");
      }

      function showGlobalError(message) {
        elements.globalError.textContent = message;
        elements.globalError.classList.add("visible");
      }

      function validateSettings() {
        clearValidationState();
        readSettingsFromInputs();

        var stages = appState.settings.stages;
        if (stages.length < MIN_STAGES) {
          return createValidationError(t("minStagesError"), elements.addStageButton);
        }
        if (stages.length > MAX_STAGES) {
          return createValidationError(t("maxStagesError"), elements.addStageButton);
        }

        var endMinutesValid = validateWholeNumberInput(elements.endMinutes.value);
        var endSecondsValid = validateWholeNumberInput(elements.endSeconds.value);
        if (!endMinutesValid || !endSecondsValid || parseWholeNumber(elements.endSeconds.value) > 59) {
          setInputError(elements.endMinutes);
          setInputError(elements.endSeconds);
          return createValidationError(t("endTimeInvalid"), elements.endMinutes);
        }

        if (!isFiniteNumber(appState.settings.extractionEndSeconds) || appState.settings.extractionEndSeconds < MIN_EXTRACTION_END_SECONDS) {
          setInputError(elements.endMinutes);
          setInputError(elements.endSeconds);
          return createValidationError(t("endTimeMin"), elements.endMinutes);
        }

        for (var index = 0; index < stages.length; index += 1) {
          var stage = stages[index];
          var stageNumber = index + 1;
          var minuteInput = findStageInput(index, "minutes");
          var secondInput = findStageInput(index, "seconds");
          var amountInput = findStageInput(index, "amount");

          if (!validateWholeNumberInput(minuteInput.value) || !validateWholeNumberInput(secondInput.value) || parseWholeNumber(secondInput.value) > 59) {
            setInputError(minuteInput);
            setInputError(secondInput);
            return createValidationError(t("stageStartInvalid", { stage: formatStageName(stageNumber) }), minuteInput, index);
          }

          if (!isFiniteNumber(stage.startSeconds) || stage.startSeconds < 0) {
            setInputError(minuteInput);
            return createValidationError(t("stageStartNonNegative", { stage: formatStageName(stageNumber) }), minuteInput, index);
          }

          if (index > 0 && stage.startSeconds <= stages[index - 1].startSeconds) {
            setInputError(minuteInput);
            setInputError(secondInput);
            return createValidationError(t("stageStartLater", { stage: formatStageName(stageNumber), previousStage: formatStageName(index) }), minuteInput, index);
          }

          if (!validatePositiveDecimalInput(amountInput.value) || stage.amountGrams <= 0) {
            setInputError(amountInput);
            return createValidationError(t("stageAmountInvalid", { stage: formatStageName(stageNumber) }), amountInput, index);
          }
        }

        var lastStage = stages[stages.length - 1];
        if (appState.settings.extractionEndSeconds <= lastStage.startSeconds) {
          setInputError(elements.endMinutes);
          setInputError(elements.endSeconds);
          return createValidationError(t("endAfterLast"), elements.endMinutes);
        }

        return { valid: true };
      }

      function createValidationError(message, input, stageIndex) {
        return {
          valid: false,
          message: message,
          input: input,
          stageIndex: typeof stageIndex === "number" ? stageIndex : null
        };
      }

      function handleValidationError(result) {
        showGlobalError(result.message);
        if (result.stageIndex !== null) {
          setStageError(result.stageIndex, result.message);
        }
        if (result.input && typeof result.input.scrollIntoView === "function") {
          result.input.scrollIntoView({ block: "center", behavior: "smooth" });
          window.setTimeout(function () {
            result.input.focus();
          }, 260);
        }
      }

      function startTimer() {
        if (appState.mode !== "editing") {
          return;
        }

        var validation = validateSettings();
        if (!validation.valid) {
          handleValidationError(validation);
          return;
        }

        appState.activeRecipe = createRecipeFromSettings(appState.settings);
        appState.mode = "running";
        appState.triggeredEvents = {};
        appState.elapsedSeconds = 0;
        appState.isPreparing = appState.activeRecipe.preparationSeconds > 0;
        appState.lastRenderedSecond = -1;
        appState.accumulatedPauseMs = 0;
        appState.pausedAtPerfMs = 0;
        appState.startPerfMs = performance.now();
        appState.speedMultiplier = appState.debugEnabled ? parseFloat(elements.speedSelect.value) || 1 : 1;

        saveSettings();
        activateAudioContext();
        requestWakeLock();
        showTimerScreen();
        updateTimerFrame();
      }

      function createRecipeFromSettings(settings) {
        var stages = settings.stages.map(function (stage, index) {
          var amount = calculateStageAmount(stage);
          return {
            index: index,
            number: index + 1,
            startSeconds: Number(stage.startSeconds),
            amount: amount
          };
        });
        var cumulativeAmounts = getCumulativeAmounts(stages);
        stages.forEach(function (stage, index) {
          stage.cumulativeAmount = cumulativeAmounts[index];
        });
        return {
          extractionEndSeconds: Number(settings.extractionEndSeconds),
          stages: stages,
          soundEnabled: Boolean(settings.soundEnabled),
          soundVolume: sanitizeSoundVolume(settings.soundVolume, DEFAULT_SETTINGS.soundVolume),
          presetName: typeof settings.presetName === "string" ? settings.presetName : "사용자 설정",
          prepNote: typeof settings.prepNote === "string" ? settings.prepNote : "",
          prepMessage: typeof settings.prepMessage === "string" && settings.prepMessage.trim() ? settings.prepMessage.trim() : t("defaultPrepMessage"),
          preparationSeconds: sanitizePreparationSeconds(settings.preparationSeconds, DEFAULT_SETTINGS.preparationSeconds)
        };
      }

      function showTimerScreen() {
        elements.setupScreen.classList.add("hidden");
        elements.setupBottomBar.classList.add("hidden");
        elements.timerScreen.classList.remove("hidden");
        elements.timerScreen.classList.remove("is-finished");
        elements.pauseButton.textContent = t("pause");
        elements.timerStateBadge.textContent = appState.activeRecipe.preparationSeconds > 0 ? t("preparingState") : t("running");
        elements.progressEndTimeText.textContent = secondsToTimeString(appState.activeRecipe.extractionEndSeconds);
        if (appState.activeRecipe.prepNote) {
          elements.timerPrepNote.textContent = appState.activeRecipe.prepNote;
          elements.timerPrepNote.classList.remove("hidden");
        } else {
          elements.timerPrepNote.textContent = "";
          elements.timerPrepNote.classList.add("hidden");
        }
        applyTimerTheme(READY_THEME);
      }

      function updateTimerFrame() {
        if (appState.mode !== "running") {
          return;
        }

        var rawElapsedMs = performance.now() - appState.startPerfMs - appState.accumulatedPauseMs;
        var runningSeconds = Math.max(0, rawElapsedMs / 1000 * appState.speedMultiplier);
        var preparationSeconds = appState.activeRecipe.preparationSeconds;

        if (runningSeconds < preparationSeconds) {
          appState.isPreparing = true;
          appState.elapsedSeconds = 0;
          renderPreparation(preparationSeconds - runningSeconds);
          appState.rafId = window.requestAnimationFrame(updateTimerFrame);
          return;
        }

        appState.isPreparing = false;
        elements.timerStateBadge.textContent = t("running");
        var elapsedSeconds = runningSeconds - preparationSeconds;
        appState.elapsedSeconds = Math.min(elapsedSeconds, appState.activeRecipe.extractionEndSeconds);

        if (appState.elapsedSeconds >= appState.activeRecipe.extractionEndSeconds) {
          finishTimer();
          return;
        }

        renderTimer(appState.elapsedSeconds);
        appState.rafId = window.requestAnimationFrame(updateTimerFrame);
      }

      function renderPreparation(remainingSeconds) {
        elements.timerMessage.textContent = appState.activeRecipe.prepMessage || t("defaultPrepMessage");
        elements.timerMessage.classList.add("long-message");
        elements.countdownText.textContent = "";
        elements.elapsedTimeText.textContent = secondsToTimeString(Math.ceil(remainingSeconds));
        elements.progressBar.style.width = "0%";
        elements.currentStageInfo.textContent = t("ready");
        elements.currentAmountInfo.textContent = "0g";
        elements.cumulativeAmountInfo.textContent = "0g";
        elements.nextStageInfo.textContent = "00:00";
        elements.timerStateBadge.textContent = t("preparingState");
        applyTimerTheme(READY_THEME);
      }

      function renderTimer(elapsedSeconds) {
        var recipe = appState.activeRecipe;
        var roundedElapsed = Math.floor(elapsedSeconds);
        var progress = Math.min(100, Math.max(0, elapsedSeconds / recipe.extractionEndSeconds * 100));
        var isFinishWarning = elapsedSeconds >= Math.max(0, recipe.extractionEndSeconds - FINISH_WARNING_SECONDS);
        var activeStage = getCurrentStage(elapsedSeconds, recipe.stages);
        var nextStage = getNextStage(elapsedSeconds, recipe.stages);
        var displayStage = activeStage || nextStage || recipe.stages[recipe.stages.length - 1];
        var remainingSeconds = getPrimaryRemainingSeconds(recipe, nextStage, elapsedSeconds);

        elements.elapsedTimeText.textContent = secondsToTimeString(remainingSeconds);
        elements.progressBar.style.width = progress.toFixed(2) + "%";

        if (isFinishWarning) {
          var remaining = Math.max(1, Math.ceil(recipe.extractionEndSeconds - elapsedSeconds));
          renderFinishWarning(remaining);
        } else if (!activeStage && nextStage) {
          renderReadyState(nextStage, elapsedSeconds);
        } else if (activeStage) {
          renderStageState(activeStage, nextStage, elapsedSeconds);
        }

        updateTimerInfo(displayStage, activeStage, nextStage, elapsedSeconds);
        if (isFinishWarning) {
          triggerFinishWarningEvent(elapsedSeconds);
        } else {
          triggerStageEvents(elapsedSeconds);
        }

        appState.lastRenderedSecond = roundedElapsed;
      }

      function getPrimaryRemainingSeconds(recipe, nextStage, elapsedSeconds) {
        var targetSeconds = nextStage ? nextStage.startSeconds : recipe.extractionEndSeconds;
        return Math.max(0, targetSeconds - elapsedSeconds);
      }

      function renderReadyState(nextStage, elapsedSeconds) {
        var remaining = Math.max(0, nextStage.startSeconds - elapsedSeconds);
        elements.timerMessage.textContent = t("prepare");
        elements.timerMessage.classList.remove("long-message");
        elements.countdownText.textContent = t("readyUntil", { stage: formatStageName(nextStage.number), time: secondsToTimeString(remaining) });
        applyTimerTheme(READY_THEME);
      }

      function renderStageState(activeStage, nextStage, elapsedSeconds) {
        elements.timerMessage.textContent = t("pourMessage", { stage: formatStageName(activeStage.number), amount: formatGrams(activeStage.amount, 0) });
        elements.timerMessage.classList.remove("long-message");
        elements.countdownText.textContent = "";
        applyTimerTheme(STAGE_THEMES[activeStage.index % STAGE_THEMES.length]);
      }

      function renderFinishWarning(remaining) {
        elements.timerMessage.textContent = t("finishWarning");
        elements.timerMessage.classList.add("long-message");
        elements.countdownText.textContent = String(remaining);
        applyTimerTheme(WARNING_THEME);
      }

      function updateTimerInfo(displayStage, activeStage, nextStage, elapsedSeconds) {
        var currentLabel = activeStage ? formatStageName(activeStage.number) : t("ready");
        elements.currentStageInfo.textContent = currentLabel;
        elements.currentAmountInfo.textContent = formatGrams(displayStage ? displayStage.amount : 0, 0);
        elements.cumulativeAmountInfo.textContent = formatGrams(activeStage ? activeStage.cumulativeAmount : 0, 0);
        elements.nextStageInfo.textContent = secondsToTimeString(elapsedSeconds);
      }

      function triggerStageEvents(elapsedSeconds) {
        appState.activeRecipe.stages.forEach(function (stage) {
          var key = "stage-" + stage.index;
          if (elapsedSeconds >= stage.startSeconds && !appState.triggeredEvents[key]) {
            appState.triggeredEvents[key] = true;
            playNotification("stage");
          }
        });
      }

      function triggerFinishWarningEvent(elapsedSeconds) {
        var warningAt = Math.max(0, appState.activeRecipe.extractionEndSeconds - FINISH_WARNING_SECONDS);
        if (elapsedSeconds >= warningAt && !appState.triggeredEvents.finishWarning) {
          appState.triggeredEvents.finishWarning = true;
          playNotification("warning");
        }
      }

      function finishTimer() {
        if (appState.mode === "finished") {
          return;
        }
        cancelAnimationFrameIfNeeded();
        appState.mode = "finished";
        appState.isPreparing = false;
        appState.elapsedSeconds = appState.activeRecipe.extractionEndSeconds;
        elements.elapsedTimeText.textContent = "00:00";
        elements.progressBar.style.width = "100%";
        elements.timerMessage.textContent = t("finishedMessage");
        elements.timerMessage.classList.add("long-message");
        elements.countdownText.textContent = "";
        elements.timerStateBadge.textContent = t("finishedState");
        elements.timerScreen.classList.add("is-finished");
        elements.currentStageInfo.textContent = t("done");
        elements.nextStageInfo.textContent = secondsToTimeString(appState.elapsedSeconds);
        applyTimerTheme(FINISHED_THEME);
        if (!appState.triggeredEvents.finished) {
          appState.triggeredEvents.finished = true;
          playNotification("finished");
        }
        releaseWakeLock();
      }

      function getCurrentStage(elapsedSeconds, stages) {
        var current = null;
        stages.forEach(function (stage) {
          if (elapsedSeconds >= stage.startSeconds) {
            current = stage;
          }
        });
        return current;
      }

      function getNextStage(elapsedSeconds, stages) {
        for (var index = 0; index < stages.length; index += 1) {
          if (elapsedSeconds < stages[index].startSeconds) {
            return stages[index];
          }
        }
        return null;
      }

      function applyTimerTheme(theme) {
        elements.timerScreen.style.setProperty("--timer-bg", theme.bg);
        elements.timerScreen.style.setProperty("--timer-fg", theme.fg);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme.bg);
      }

      function togglePause() {
        if (appState.mode === "running") {
          pauseTimer();
        } else if (appState.mode === "paused") {
          resumeTimer();
        }
      }

      function pauseTimer() {
        if (appState.mode !== "running") {
          return;
        }
        appState.mode = "paused";
        appState.pausedAtPerfMs = performance.now();
        cancelAnimationFrameIfNeeded();
        elements.pauseButton.textContent = t("continue");
        elements.timerStateBadge.textContent = t("paused");
        releaseWakeLock();
      }

      function resumeTimer() {
        if (appState.mode !== "paused") {
          return;
        }
        appState.accumulatedPauseMs += performance.now() - appState.pausedAtPerfMs;
        appState.pausedAtPerfMs = 0;
        appState.mode = "running";
        elements.pauseButton.textContent = t("pause");
        elements.timerStateBadge.textContent = appState.isPreparing ? t("preparingState") : t("running");
        requestWakeLock();
        updateTimerFrame();
      }

      function requestTimerReset() {
        if (appState.mode === "running" || appState.mode === "paused") {
          openModal({
            title: t("resetTimerTitle"),
            message: t("resetTimerMessage"),
            confirmText: t("reset"),
            confirmClass: "danger",
            onConfirm: resetTimerToSetup
          });
        } else {
          resetTimerToSetup();
        }
      }

      function resetTimerToSetup() {
        cancelAnimationFrameIfNeeded();
        releaseWakeLock();
        appState.mode = "editing";
        appState.activeRecipe = null;
        appState.elapsedSeconds = 0;
        appState.isPreparing = false;
        elements.timerScreen.classList.add("hidden");
        elements.timerScreen.classList.remove("is-finished");
        elements.setupScreen.classList.remove("hidden");
        elements.setupBottomBar.classList.remove("hidden");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#6f4e37");
        renderSetupScreen();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function restartSameRecipe() {
        if (!appState.activeRecipe) {
          returnToSetup();
          return;
        }
        cancelAnimationFrameIfNeeded();
        appState.mode = "running";
        appState.elapsedSeconds = 0;
        appState.isPreparing = appState.activeRecipe.preparationSeconds > 0;
        appState.triggeredEvents = {};
        appState.accumulatedPauseMs = 0;
        appState.pausedAtPerfMs = 0;
        appState.startPerfMs = performance.now();
        elements.timerScreen.classList.remove("is-finished");
        elements.timerMessage.classList.remove("long-message");
        elements.pauseButton.textContent = t("pause");
        elements.timerStateBadge.textContent = appState.isPreparing ? t("preparingState") : t("running");
        activateAudioContext();
        requestWakeLock();
        updateTimerFrame();
      }

      function returnToSetup() {
        resetTimerToSetup();
      }

      function cancelAnimationFrameIfNeeded() {
        if (appState.rafId) {
          window.cancelAnimationFrame(appState.rafId);
          appState.rafId = null;
        }
      }

      function activateAudioContext() {
        if (!appState.settings.soundEnabled) {
          return;
        }
        try {
          var AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) {
            return;
          }
          if (!appState.audioContext) {
            appState.audioContext = new AudioContextClass();
          }
          if (appState.audioContext.state === "suspended") {
            appState.audioContext.resume();
          }
        } catch (error) {
          appState.audioContext = null;
        }
      }

      function playNotification(type) {
        var soundSource = appState.activeRecipe || appState.settings;
        if (!soundSource || !soundSource.soundEnabled) {
          return;
        }
        activateAudioContext();
        if (!appState.audioContext) {
          return;
        }
        try {
          if (type === "stage") {
            playToneSequence([660, 880], 0.075, 0.055, soundSource.soundVolume);
          } else if (type === "warning") {
            playToneSequence([520, 420, 520], 0.08, 0.045, soundSource.soundVolume);
          } else if (type === "finished") {
            playToneSequence([660, 830, 990, 1180], 0.09, 0.045, soundSource.soundVolume);
          } else if (type === "sample") {
            playToneSequence([740, 980], 0.075, 0.055, soundSource.soundVolume);
          }
        } catch (error) {
          // 오디오가 차단되더라도 타이머 동작은 유지한다.
        }
      }

      function playSoundPreview() {
        if (!appState.settings.soundEnabled) {
          return;
        }
        activateAudioContext();
        if (!appState.audioContext) {
          return;
        }
        try {
          playToneSequence([740, 980], 0.075, 0.055, appState.settings.soundVolume);
        } catch (error) {
          // 미리듣기 소리가 차단되어도 설정 저장은 유지한다.
        }
      }

      function playToneSequence(frequencies, duration, gap, soundVolume) {
        var context = appState.audioContext;
        var volumeRatio = sanitizeSoundVolume(soundVolume, DEFAULT_SETTINGS.soundVolume) / 100;
        if (volumeRatio <= 0) {
          return;
        }
        var peakGain = Math.min(0.6, Math.max(0.0001, volumeRatio * 0.6));
        var now = context.currentTime;
        frequencies.forEach(function (frequency, index) {
          var start = now + index * (duration + gap);
          var oscillator = context.createOscillator();
          var gain = context.createGain();
          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(frequency, start);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(peakGain, start + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
          oscillator.connect(gain);
          gain.connect(context.destination);
          oscillator.start(start);
          oscillator.stop(start + duration + 0.02);
        });
      }

      function requestWakeLock() {
        if (!("wakeLock" in navigator) || !navigator.wakeLock || appState.mode !== "running") {
          updateWakeLockHint();
          return;
        }
        navigator.wakeLock.request("screen").then(function (wakeLock) {
          appState.wakeLock = wakeLock;
          appState.wakeLock.addEventListener("release", function () {
            appState.wakeLock = null;
            updateWakeLockHint();
          });
          updateWakeLockHint();
        }).catch(function () {
          appState.wakeLock = null;
          updateWakeLockHint();
        });
      }

      function releaseWakeLock() {
        if (!appState.wakeLock) {
          updateWakeLockHint();
          return;
        }
        appState.wakeLock.release().catch(function () {
          // 이미 해제된 경우도 있다.
        }).then(function () {
          appState.wakeLock = null;
          updateWakeLockHint();
        });
      }

      function updateWakeLockHint() {
        if (!("wakeLock" in navigator)) {
          elements.wakeLockHint.textContent = t("wakeKeepScreen");
        } else if (appState.wakeLock) {
          elements.wakeLockHint.textContent = t("wakeActive");
        } else {
          elements.wakeLockHint.textContent = t("wakeAfterStart");
        }
      }

      function resetSettingsToDefault() {
        var language = appState.settings.language;
        appState.settings = createDefaultSettings();
        appState.settings.language = language;
        elements.languageSelect.value = language;
        applyTranslations();
        renderSetupScreen();
        saveSettings();
        window.setTimeout(function () {
          window.location.reload();
        }, 80);
      }

      function openModal(options) {
        appState.lastFocusedElement = document.activeElement;
        appState.modalConfirmHandler = options.onConfirm;
        elements.modalTitle.textContent = options.title || t("confirmTitle");
        elements.modalMessage.textContent = options.message || t("confirmMessage");
        elements.modalConfirmButton.textContent = options.confirmText || t("confirm");
        elements.modalConfirmButton.className = "btn " + (options.confirmClass || "primary");
        elements.modalBackdrop.classList.add("open");
        elements.modalConfirmButton.focus();
      }

      function closeModal() {
        elements.modalBackdrop.classList.remove("open");
        appState.modalConfirmHandler = null;
        if (appState.lastFocusedElement && typeof appState.lastFocusedElement.focus === "function") {
          appState.lastFocusedElement.focus();
        }
      }

      function confirmModal() {
        var handler = appState.modalConfirmHandler;
        closeModal();
        if (typeof handler === "function") {
          handler();
        }
      }

      function calculateStageAmount(stage) {
        var amount = Number(stage.amountGrams);
        if (!isFiniteNumber(amount)) {
          amount = Number(stage.amount);
        }
        return isFiniteNumber(amount) ? amount : 0;
      }

      function getCumulativeAmounts(stages) {
        var total = 0;
        return stages.map(function (stage) {
          total += calculateStageAmount(stage);
          return total;
        });
      }

      function parsePreparationSeconds(value) {
        var match = String(value || "").match(/\d+(?:\.\d+)?/);
        return match ? sanitizePreparationSeconds(match[0], DEFAULT_SETTINGS.preparationSeconds) : DEFAULT_SETTINGS.preparationSeconds;
      }

      function sanitizePreparationSeconds(value, fallback) {
        var fallbackValue = Number.isFinite(Number(fallback)) ? Number(fallback) : 5;
        var seconds = Number(value);
        if (!Number.isFinite(seconds)) {
          seconds = fallbackValue;
        }
        return Math.min(MAX_PREPARATION_SECONDS, Math.max(0, Math.floor(seconds)));
      }

      function sanitizeSoundVolume(value, fallback) {
        var fallbackValue = Number.isFinite(Number(fallback)) ? Number(fallback) : 30;
        var volume = Number(value);
        if (!Number.isFinite(volume)) {
          volume = fallbackValue;
        }
        return Math.min(100, Math.max(0, Math.round(volume)));
      }

      function parseWholeNumber(value) {
        if (value === "" || value === null || typeof value === "undefined") {
          return NaN;
        }
        var parsed = Number(value);
        if (!Number.isFinite(parsed) || Math.floor(parsed) !== parsed) {
          return NaN;
        }
        return parsed;
      }

      function parseDecimalNumber(value) {
        if (value === "" || value === null || typeof value === "undefined") {
          return NaN;
        }
        var parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : NaN;
      }

      function validateWholeNumberInput(value) {
        var parsed = parseWholeNumber(value);
        return Number.isFinite(parsed) && parsed >= 0;
      }

      function validatePositiveDecimalInput(value) {
        var parsed = parseDecimalNumber(value);
        return Number.isFinite(parsed) && parsed > 0;
      }

      function combineTimeParts(minutes, seconds) {
        if (!Number.isFinite(minutes) || !Number.isFinite(seconds)) {
          return NaN;
        }
        return minutes * 60 + seconds;
      }

      function secondsToParts(totalSeconds) {
        var safeSeconds = Math.max(0, Math.floor(Number(totalSeconds) || 0));
        return {
          minutes: Math.floor(safeSeconds / 60),
          seconds: safeSeconds % 60
        };
      }

      function secondsToTimeString(totalSeconds) {
        var safeSeconds = Math.max(0, Math.floor(Number(totalSeconds) || 0));
        var minutes = Math.floor(safeSeconds / 60);
        var seconds = safeSeconds % 60;
        return pad2(minutes) + ":" + pad2(seconds);
      }

      function pad2(value) {
        return String(Math.max(0, Math.floor(Number(value) || 0))).padStart(2, "0");
      }

      function formatGrams(value, decimals) {
        var numeric = Number(value);
        if (!Number.isFinite(numeric)) {
          numeric = 0;
        }
        var rounded = decimals === 0 ? Math.round(numeric) : Math.round(numeric * 10) / 10;
        if (Number.isInteger(rounded)) {
          return String(rounded) + "g";
        }
        return rounded.toFixed(decimals) + "g";
      }

      function formatNumberInput(value) {
        var numeric = Number(value);
        return Number.isFinite(numeric) ? String(numeric) : "";
      }

      function sanitizeNonNegativeNumber(value, fallback) {
        var numeric = Number(value);
        return Number.isFinite(numeric) && numeric >= 0 ? numeric : fallback;
      }

      function sanitizePositiveNumber(value, fallback) {
        var numeric = Number(value);
        return Number.isFinite(numeric) && numeric > 0 ? numeric : fallback;
      }

      function isFiniteNumber(value) {
        return typeof value === "number" && Number.isFinite(value);
      }

      function isStoredNonNegativeNumber(value) {
        return typeof value === "number" && Number.isFinite(value) && value >= 0;
      }

      function isStoredPositiveNumber(value) {
        return typeof value === "number" && Number.isFinite(value) && value > 0;
      }
    })();
  </script>
</body>
</html>
